name: Build and Publish Multi-Platform Flutter SDK Container to Docker Hub

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter SDK version to build"
        required: true
        type: string

jobs:
  # 阶段 1：解析并校验目标 Flutter 版本与 Docker Hub 凭据
  prepare:
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.version.outputs.flutter_version }}
    steps:
      - name: Determine Flutter version
        id: version
        run: |
          if [ -n "${{ inputs.flutter_version }}" ]; then
            VERSION="${{ inputs.flutter_version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v?([0-9]+\.[0-9]+.*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/(.*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "Error: Flutter version is not specified! Please trigger via a tag or specify flutter_version in workflow_dispatch." >&2
            exit 1
          fi
          echo "Target Flutter version: $VERSION"
          echo "flutter_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub secrets
        run: |
          if [ -z "${{ vars.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Error: DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret is missing! Please configure them in repository Settings -> Secrets and variables -> Actions -> Secrets." >&2
            exit 1
          fi

  # 阶段 2：独立申请 x64 (ubuntu-latest) 与 arm64 (ubuntu-24.04-arm) 两个硬件平台并行打包
  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform-clean: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform-clean: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 若在非 ARM64 宿主机上构建 ARM64，则按需启用 QEMU 作为容灾后备
      - name: Set up QEMU (fallback if running arm64 on x86 runner)
        if: runner.arch != 'ARM64' && matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure Buildx outputs
        id: outputs
        run: |
          DH_USER=$(echo "${{ vars.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          DH_REPO=$(echo "${{ vars.DOCKERHUB_REPO || 'flutter-sdk-container' }}" | tr '[:upper:]' '[:lower:]')
          FULL_IMAGE="${DH_USER}/${DH_REPO}"
          echo "Resolved Docker Hub target: $FULL_IMAGE"
          OUTPUTS="type=image,name=${FULL_IMAGE},push-by-digest=true,name-canonical=true,push=true"
          echo "build_outputs=$OUTPUTS" >> "$GITHUB_OUTPUT"

      - name: Build and push single platform by digest to Docker Hub
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            FLUTTER_VERSION=${{ needs.prepare.outputs.flutter_version }}
          outputs: ${{ steps.outputs.outputs.build_outputs }}
          cache-from: type=gha,scope=${{ matrix.platform-clean }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform-clean }}

      - name: Export digest artifact
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform-clean }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # 阶段 3：合并各架构 digest 并向 Docker Hub 发布统一的多平台 manifest
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-platform manifest to Docker Hub
        working-directory: ${{ runner.temp }}/digests
        run: |
          DH_USER=$(echo "${{ vars.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          DH_REPO=$(echo "${{ vars.DOCKERHUB_REPO || 'flutter-sdk-container' }}" | tr '[:upper:]' '[:lower:]')
          DH_IMAGE="${DH_USER}/${DH_REPO}"
          VERSION="${{ needs.prepare.outputs.flutter_version }}"
          SOURCES=$(printf "${DH_IMAGE}@sha256:%s " *)
          echo "Assembling Docker Hub manifest from sources: $SOURCES"
          docker buildx imagetools create \
            -t "${DH_IMAGE}:${VERSION}" \
            -t "${DH_IMAGE}:latest" \
            $SOURCES

  # 阶段 4：从 Docker Hub 拉取并验证多平台镜像
  verify:
    needs: [prepare, merge]
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU for verification
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify multi-arch images from Docker Hub
        run: |
          DH_USER=$(echo "${{ vars.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          DH_REPO=$(echo "${{ vars.DOCKERHUB_REPO || 'flutter-sdk-container' }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${DH_USER}/${DH_REPO}:${{ needs.prepare.outputs.flutter_version }}"
          echo "===> Pulling and verifying x86_64 image from Docker Hub..."
          docker run --rm --platform linux/amd64 "$IMAGE_TAG" flutter --version
          echo "===> Pulling and verifying arm64 image from Docker Hub via QEMU..."
          docker run --rm --platform linux/arm64 "$IMAGE_TAG" flutter --version
